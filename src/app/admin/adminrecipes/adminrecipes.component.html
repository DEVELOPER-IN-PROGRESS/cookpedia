<app-adminheader></app-adminheader>
<div class="container-fluid p-0 overflow-x-hidden">
    <div class="row g-0">
        <div class="col-md-2">
            <app-adminsidebar></app-adminsidebar>
        </div>
        <div class="col-md-10">
             <div class="w-100 bg-warning p-3">
                <h1 class="fs-4">
                    <i class="fa-solid fa-bowl-rice me-2"></i>
                    Recipes
                </h1>
            </div>

            <h3 class="text-center my-3">Recipe List</h3>

            <div class="d-flex justify-content-between px-4 mt-4">
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#adminRecipe">
                     Add Recipe
                    <i class="fa-solid fa-plus ms-2"></i>
                </button>
                <input [(ngModel)]="searchKey" type="text" class="form-control w-25" placeholder="name" />
            </div>

            <div class="table-responsive px-4 my-5">
                @if(allRecipes.length){
                    <table class="table table-bordered">
                        <thead>
                            <th class="bg-success">Sl</th>
                            <th class="bg-success">Name</th>
                            <th class="bg-success">Image</th>
                            <th class="bg-success">Cuisine</th>
                            <th class="bg-success">Actions</th>
                        </thead>
                    <tbody>
                        @for(item of allRecipes | search: searchKey ;track $index){
                            <tr>
                                <td> {{ $index+1 }}</td>
                                <td>{{ item.name }}</td>
                                <td>
                                    <img [src]="item.image" [alt]="item.name" class="img-fluid" style="width:80px;" />
                                </td>
                                <td>{{ item.cuisine }} </td>
                                <td>
                                    <button type="button"  class="btn btn-outline-primary">
                                        <i class="fa-solid fa-pen-square"></i>
                                    </button>
                                    <button type="button" (click)="deleteReceipe(item._id)"  class="btn btn-outline-danger ms-4">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        }
                    </tbody>
                    </table>
                }@else {
                    <h3 class="text-danger fs-3">No Recipes...</h3>
                }
            </div>

        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade " id="adminRecipe" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success">
        <h1 class="modal-title fs-3 text-light" id="exampleModalLabel">Recipe Details</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <form [formGroup]="recipeForm">
            <div class="row justify-content-center">
                <div class="row justify-content-between">
                    <div class="col-6 px-0">
                        <div class="mb-3">
                            <input  type="text" name="recipeName" formControlName="recipeName" placeholder="Name of the recipe" class="form-control" />
                        </div>
                    </div>
                    <div class="col-6 px-0">
                        <div class="mb-3">
                            <input  type="text" name="servings" formControlName="servings" placeholder="Servings" class="form-control" />
                        </div>
                    </div>
                </div>
                <div class="row justify-content-between">
                    <div class="col-6 px-0 ">
                        <div class="mb-3">
                            <input  type="text" name="prepTime" formControlName="prepTime" placeholder="Preparation Time" class="form-control" />
                        </div>
                    </div>
                    <div class="col-6 px-0">
                        <div class="mb-3">
                            <input  type="text" name="cookingTime" formControlName="cookingTime" placeholder="Cooking Time" class="form-control" />
                        </div>
                    </div>
                </div>
                <div class="row justify-content-between">
                    <div class="col-6 px-0">
                        <div class="mb-3">
                            <input  type="text" name="calories" formControlName="calories" placeholder="Calories" class="form-control" />
                        </div>
                    </div>
                    <div class="col-6 px-0">
                        <div class="mb-3">
                            <input  type="text" name="rating" formControlName="rating" placeholder="Ratings" class="form-control" />
                        </div>
                    </div>
                </div>
            </div>

        <div class="mb-3">
            <select name="modeofCooking" formControlName="modeofCooking" id="" class="form-select">
                <option [defaultSelected]="true" value="">Mode of Cooking</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        <div class="mb-3">
            @if(allMealTypes.length){
            <ng-multiselect-dropdown
            [placeholder]="'Meal Types'"
            [settings]="dropdownSettings"
            [data]="dropdownList"
            (onSelect)="onItemSelect($event)"
            (onSelectAll)="onSelectAll($event)"
            >
            </ng-multiselect-dropdown>
            }
        </div>

        <div class="mb-3">
             <select name="cuisineType" formControlName="cuisineType" id="" class="form-select">
                <option [defaultSelected]="true" value="" disabled>Cuisine Type</option>
                @for( cuisine of cuisineTypes ;track $index){
                    <option [value]="cuisine">{{ cuisine }}</option>
                }
            </select>
        </div>

        <div class="mb-3 d-flex">
            <input  type="text" #ingredient class="form-control rounded-0" placeholder="Add Ingredient" />
            <button type="button" (click)="addIngredient(ingredient)" class="btn btn-success rounded-0">Add</button>
        </div>

        <div class="mb-3 d-flex">
            <input  type="text" #instruction class="form-control rounded-0" placeholder="Add instructions" />
            <button type="button" (click)="addInstruction(instruction)" class="btn btn-success rounded-0">Add</button>
        </div>

        <div class="mb-0">
            <label for="recipeImage">Upload Image</label>
            <input name="image" formControlName="image"  type="file" (change)="getFile($event)" id="recipeImage" placeholder="Recipe Image" class="form-control" />
        </div>

        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Reset</button>
        <button type="button" (click)="save()" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>
