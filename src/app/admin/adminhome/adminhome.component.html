<app-adminheader></app-adminheader>
<div class="container-fluid p-0 overflow-x-hidden">
    <div class="row g-0">
        <div class="col-md-2">
            <app-adminsidebar></app-adminsidebar>
        </div>
        <div class="col-md-10">
            <div class="w-100 bg-warning p-3">
                <h1 class="fs-4">
                    <i class="fa-solid fa-bars me-2"></i>
                    Dashboard
                </h1>
            </div>

            <div class="row g-0">
                <div class="col-md-3 py-3 px-4">
                    <div class="w-100 bg-info p-3 rounded">
                        <div class="row text-light">
                            <div class="col-md-3 d-flex justify-content-center align-items-center">
                                <i class="fa-solid fa-user fa-2x"></i>
                            </div>
                            <div class="col-md-9">
                                <p class="fs-4">Users {{ userCount }}</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 py-3 px-4">
                    <div class="w-100 bg-danger p-3 rounded">
                        <div class="row text-light">
                            <div class="col-md-3 d-flex justify-content-center align-items-center">
                                <i class="fa-solid fa-bowl-rice fa-2x"></i>
                            </div>
                            <div class="col-md-9">
                                <p class="fs-4">Recipes {{ recipeCount }}</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 py-3 px-4">
                    <div class="w-100 bg-primary p-3 rounded">
                        <div class="row text-light">
                            <div class="col-md-3 d-flex justify-content-center align-items-center">
                                <i class="fa-solid fa-download fa-2x"></i>
                            </div>
                            <div class="col-md-9">
                                <p class="fs-4">Downloads {{ downloadCount }} </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 py-3 px-4">
                    <div class="w-100 bg-secondary p-3 rounded">
                        <div class="row text-light">
                            <div class="col-md-3 d-flex justify-content-center align-items-center">
                                <i class="fa-solid fa-message fa-2x"></i>
                            </div>
                            <div class="col-md-9">
                                <p class="fs-4">Notification 12+</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-0 my-4">
                <div class="col-md-7">
                    <!-- graphs high charts -->
                     <highcharts-chart
                    [options]="chartOptions"
                    class="chart"
                    styles="width: 100%; height: 400px; display: block;"
                    />

                </div>
                <div class="col-md-5 d-flex justify-content-center align-items-center">
                    <!-- calendar -->
                    <mat-card class="demo-inline-calendar-card">
                        <mat-calendar [(selected)]="selected"></mat-calendar>
                    </mat-card>
                </div>
            </div>
        </div>
    </div>
</div>
