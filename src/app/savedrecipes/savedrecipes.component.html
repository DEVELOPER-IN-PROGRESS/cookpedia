<app-header></app-header>

<h1 class="text-success text-center my-5">Saved Recipes</h1>

<div class="container">
    <div class="row my-3 ">
        @if(allSavedRecipes.length > 0){
            @for(item of allSavedRecipes;track $index){
                <div class="col-md-3 shadow p-2">
                    <img [src]="item.image" (click)="viewRecipe(item.recipeId)" alt="no image" class="w-100 rounded">
                    <h4 class="text-center mt-2"> {{ item.name.slice(0,15) }}</h4>
                    <div class="d-flex justify-content-end">
                        <button (click)="deleteRecipe(item._id)" class="btn btn-danger">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            }
       }@else{
         <div class="w-100 d-flex my-5 justify-content-center flex-column">
            <p class="text-danger text-center ">No Saved Recipes Yet</p>
            <button routerLink="/all-recipes" class="btn btn-success mt-3 w-auto">Back to All Recipes</button>
         </div>
       }
    </div>
</div>
